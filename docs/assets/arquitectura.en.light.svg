<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 720" width="560" height="720" role="img" aria-label="PeyOS Architecture: CoDi charge, webhook verification, OTP issuance, and real-time station activation">
  <rect width="560" height="720" fill="#F8FAFC" rx="16" stroke="#CBD5E1" stroke-width="2"/>
  
