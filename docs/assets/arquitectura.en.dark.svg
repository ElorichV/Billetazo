  <text x="64" y="570" fill="#FDE68A" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700">4. One-Time PIN &amp; Live Stations (SSE)</text>
  <text x="64" y="600" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="18">• PeyStudio: Web Audio Synthesizer &amp; Shared Mural</text>
