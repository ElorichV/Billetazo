  <polygon points="273,226 287,226 280,238" fill="#64748B"/>

  <rect x="40" y="240" width="480" height="96" rx="12" fill="#1E293B" stroke="#818CF8" stroke-width="2"/>
  <text x="64" y="276" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700">2. Banxico CoDi Network &amp; pey.mx API</text>
  <text x="64" y="306" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="18">Direct settlement to 5 CLABEs (BBVA, Santander, Azteca)</text>

