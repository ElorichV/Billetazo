  <text x="64" y="446" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="18">Verifies HMAC-SHA256 and deduplicates webhook-id</text>
  <text x="64" y="472" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="18">Late payments issue signed VCHR credit voucher</text>

  <line x1="280" y1="490" x2="280" y2="524" stroke="#64748B" stroke-width="3"/>
  <polygon points="273,520 287,520 280,532" fill="#64748B"/>

